project:
  type: manuscript
  execute-dir: project

manuscript:
  article: paper.qmd
  notebooks:
    - notebooks/Analysis_01.qmd
    - notebooks/Data_collection.qmd
  # cbat4rで作成した課題を，デモを動かせる形でサイトに含める。
